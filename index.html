
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카카오맵 장소 검색</title>

  <style>
    /* 기본 설정 */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      background: #f5f6f8;
    }

    /* 전체 화면 */
    .container {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    /* 왼쪽 검색 영역 */
    .sidebar {
      width: 360px;
      min-width: 300px;
      background: white;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #ddd;
      z-index: 2;
    }

    .header {
      padding: 24px 20px;
      border-bottom: 1px solid #eee;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 22px;
    }

    .search-box {
      display: flex;
      gap: 8px;
    }

    #searchInput {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    #searchInput:focus {
      border-color: #ffcb00;
    }

    #searchButton {
      padding: 12px 16px;
      background: #fee500;
      color: #222;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    #searchButton:hover {
      background: #f5d900;
    }

    /* 검색 결과 */
    .result-header {
      padding: 16px 20px;
      font-size: 14px;
      color: #666;
      border-bottom: 1px solid #eee;
    }

    #resultList {
      flex: 1;
      overflow-y: auto;
    }

    .result-item {
      padding: 18px 20px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .result-item:hover {
      background: #fafafa;
    }

    .place-name {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .place-address {
      font-size: 13px;
      color: #666;
      margin-bottom: 5px;
    }

    .place-category {
      font-size: 12px;
      color: #999;
    }

    .place-link {
      display: inline-block;
      margin-top: 8px;
      font-size: 12px;
      color: #2878d0;
      text-decoration: none;
    }

    /* 오른쪽 지도 */
    .map-area {
      flex: 1;
      position: relative;
      min-width: 0;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* 현재 위치 버튼 */
    #locationButton {
      position: absolute;
      right: 20px;
      bottom: 25px;
      z-index: 3;
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px 16px;
      cursor: pointer;
      box-shadow: 0 2px 8px #0002;
      font-weight: bold;
    }

    /* 로딩 표시 */
    #loading {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      padding: 12px 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px #0002;
      z-index: 5;
      font-size: 13px;
    }

    .hidden {
      display: none;
    }

    /* 모바일 화면 */
    @media (max-width: 700px) {
      .container {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        min-width: 0;
        height: 45%;
      }

      .map-area {
        height: 55%;
        flex: none;
      }

      .header {
        padding: 15px;
      }

      h1 {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- 왼쪽 검색창 -->
    <div class="sidebar">

      <div class="header">
        <h1>장소 검색</h1>

        <div class="search-box">
          <input
            type="text"
            id="searchInput"
            placeholder="장소를 검색하세요"
          >
          <button id="searchButton">검색</button>
        </div>
      </div>

      <div class="result-header" id="resultCount">
        검색어를 입력해 주세요.
      </div>

      <div id="resultList"></div>

    </div>

    <!-- 오른쪽 지도 -->
    <div class="map-area">

      <div id="map"></div>

      <div id="loading">
        지도를 불러오는 중...
      </div>

      <button id="locationButton">
        ◎ 내 위치
      </button>

    </div>

  </div>

  <script>
    // 카카오 JavaScript API 키
    const KAKAO_JS_KEY =
      "0fb9406d5e25da7b3ad478b6ccbfbc0b";

    // 지도 관련 변수
    let map;
    let places;
    let infoWindow;
    let markers = [];
    let currentMarker = null;

    // 기본 위치: 서울시청
    const DEFAULT_LAT = 37.5665;
    const DEFAULT_LNG = 126.9780;

    // 지도 확대 레벨
    const MAP_LEVEL = 5;

    // HTML 요소 가져오기
    const searchInput =
      document.getElementById("searchInput");

    const searchButton =
      document.getElementById("searchButton");

    const resultList =
      document.getElementById("resultList");

    const resultCount =
      document.getElementById("resultCount");

    const locationButton =
      document.getElementById("locationButton");

    const loading =
      document.getElementById("loading");

    // 로딩 메시지 변경
    function showLoading(message) {
      loading.textContent = message;
      loading.classList.remove("hidden");
    }

    function hideLoading() {
      loading.classList.add("hidden");
    }

    // 카카오 SDK 불러오기
    function loadKakaoSDK() {
      return new Promise((resolve, reject) => {

        const script = document.createElement("script");

        script.src =
          "https://dapi.kakao.com/v2/maps/sdk.js" +
          "?appkey=" + KAKAO_JS_KEY +
          "&libraries=services" +
          "&autoload=false";

        // SDK 로딩이 끝난 뒤 실행
        script.onload = function() {

          if (!window.kakao || !kakao.maps) {
            reject(new Error("카카오맵 SDK 초기화 실패"));
            return;
          }

          kakao.maps.load(function() {
            resolve();
          });
        };

        script.onerror = function() {
          reject(new Error("카카오맵 SDK 로딩 실패"));
        };

        document.head.appendChild(script);
      });
    }

    // 지도 생성
    function initializeMap() {

      const mapContainer =
        document.getElementById("map");

      const mapOptions = {
        center: new kakao.maps.LatLng(
          DEFAULT_LAT,
          DEFAULT_LNG
        ),
        level: MAP_LEVEL
      };

      map = new kakao.maps.Map(
        mapContainer,
        mapOptions
      );

      // 장소 검색 객체 생성
      places = new kakao.maps.services.Places();

      // 정보창 생성
      infoWindow = new kakao.maps.InfoWindow({
        zIndex: 10
      });

      // 지도 생성 후 현재 위치 요청
      requestCurrentLocation();
    }

    // 현재 위치 가져오기
    function requestCurrentLocation() {

      if (!navigator.geolocation) {
        alert("이 브라우저는 위치 기능을 지원하지 않습니다.");
        hideLoading();
        return;
      }

      showLoading("현재 위치를 확인하는 중...");

      navigator.geolocation.getCurrentPosition(

        function(position) {

          const latitude =
            position.coords.latitude;

          const longitude =
            position.coords.longitude;

          const currentPosition =
            new kakao.maps.LatLng(
              latitude,
              longitude
            );

          // 지도를 현재 위치로 이동
          map.setCenter(currentPosition);
          map.setLevel(MAP_LEVEL);

          // 기존 현재 위치 마커 제거
          if (currentMarker) {
            currentMarker.setMap(null);
          }

          // 현재 위치 마커 생성
          currentMarker = new kakao.maps.Marker({
            position: currentPosition,
            map: map
          });

          hideLoading();
        },

        function(error) {

          console.warn("위치 확인 실패:", error.message);

          // 위치 권한이 없으면 기본 위치 사용
          hideLoading();

          resultCount.textContent =
            "위치를 확인할 수 없어 기본 지도를 표시합니다.";
        },

        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }

    // 기존 검색 마커 삭제
    function clearMarkers() {

      markers.forEach(function(marker) {
        marker.setMap(null);
      });

      markers = [];
    }

    // 장소 검색
    function searchPlaces() {

      const keyword = searchInput.value.trim();

      if (!keyword) {
        alert("검색어를 입력해 주세요.");
        searchInput.focus();
        return;
      }

      if (!places) {
        alert("지도가 아직 준비되지 않았습니다.");
        return;
      }

      showLoading("장소를 검색하는 중...");

      // 카카오 장소 검색 API 호출
      places.keywordSearch(
        keyword,
        function(data, status, pagination) {

          hideLoading();

          if (
            status ===
            kakao.maps.services.Status.OK
          ) {
            displayResults(data);
          }

          else if (
            status ===
            kakao.maps.services.Status.ZERO_RESULT
          ) {
            clearMarkers();
            resultList.innerHTML = "";
            resultCount.textContent =
              "검색 결과가 없습니다.";
          }

          else {
            resultCount.textContent =
              "검색 중 오류가 발생했습니다.";
          }
        }
      );
    }

    // 검색 결과 표시
    function displayResults(data) {

      clearMarkers();

      resultList.innerHTML = "";

      resultCount.textContent =
        "검색 결과 " + data.length + "개";

      // 검색 결과가 포함되는 지도 영역
      const bounds =
        new kakao.maps.LatLngBounds();

      data.forEach(function(place, index) {

        const position =
          new kakao.maps.LatLng(
            Number(place.y),
            Number(place.x)
          );

        // 검색 결과 마커 생성
        const marker =
          new kakao.maps.Marker({
            position: position,
            map: map
          });

        markers.push(marker);

        bounds.extend(position);

        // 결과 항목 생성
        const item =
          document.createElement("div");

        item.className = "result-item";

        const name =
          document.createElement("div");

        name.className = "place-name";
        name.textContent = place.place_name;

        const address =
          document.createElement("div");

        address.className = "place-address";

        address.textContent =
          place.road_address_name ||
          place.address_name;

        const category =
          document.createElement("div");

        category.className = "place-category";
        category.textContent =
          place.category_name || "";

        const link =
          document.createElement("a");

        link.className = "place-link";
        link.textContent = "카카오맵에서 보기";
        link.href = place.place_url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        // 결과 항목에 정보 추가
        item.appendChild(name);
        item.appendChild(address);
        item.appendChild(category);
        item.appendChild(link);

        resultList.appendChild(item);

        // 장소 선택 시 지도 이동
        function selectPlace() {

          map.setCenter(position);
          map.setLevel(3);

          infoWindow.setContent(
            '<div style="padding:10px;font-size:13px;">' +
            escapeHTML(place.place_name) +
            '</div>'
          );

          infoWindow.open(map, marker);
        }

        // 리스트 클릭 이벤트
        item.addEventListener("click", function(event) {
          if (event.target.closest("a")) {
            return;
          }

          selectPlace();
        });

        // 마커 클릭 이벤트
        kakao.maps.event.addListener(
          marker,
          "click",
          selectPlace
        );
      });

      // 검색 결과 전체가 보이도록 지도 조정
      if (data.length > 0) {
        map.setBounds(bounds);
      }
    }

    // 정보창에 표시할 텍스트 보호
    function escapeHTML(text) {

      return String(text).replace(
        /[&<>"']/g,
        function(character) {

          const entities = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
          };

          return entities[character];
        }
      );
    }

    // 검색 버튼 클릭
    searchButton.addEventListener(
      "click",
      searchPlaces
    );

    // Enter 키로 검색
    searchInput.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          searchPlaces();
        }
      }
    );

    // 현재 위치 버튼
    locationButton.addEventListener(
      "click",
      function() {

        if (map) {
          requestCurrentLocation();
        }
      }
    );

    // 페이지 시작
    async function startApplication() {

      try {

        showLoading("카카오맵을 불러오는 중...");

        // SDK 로딩이 완료될 때까지 대기
        await loadKakaoSDK();

        // SDK 준비 후 지도 생성
        initializeMap();

      } catch (error) {

        console.error(error);

        showLoading(
          "지도를 불러오지 못했습니다. API 키와 도메인 설정을 확인하세요."
        );
      }
    }

    // HTML 로딩이 끝난 후 실행
    document.addEventListener(
      "DOMContentLoaded",
      startApplication
    );

  </script>

</body>
</html>
